<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>LinkDemo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      transition: background 0.5s ease;
      background: linear-gradient(to top right, #0cda0c, #01040c);
    }

    .container {
      max-width: 600px;
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      color: white;
    }

    .profile-pic {
      border: 3px solid white;
      border-radius: 50%;
      width: 200px;
      height: 200px;
      object-fit: cover;
    }

    .profile-wrapper {
      position: relative;
      display: inline-block;
    }

    .demo-label {
      position: absolute;
      bottom: 10px;
      right: -10px;
      background-color: #FFD700;
      color: black;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
      z-index: 1;
    }

    .demo-label:hover {
      background-color: #FFC107;
    }

    h1 {
      margin-top: 10px;
    }

    p {
      font-size: 1rem;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 10px 0;
    }

    .share-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border: 2px solid white;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .share-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .share-button i {
      margin-left: 10px;
    }

    .actions {
      margin-top: 20px;
    }

    #a2hs-popup {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      color: black;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 999;
      display: none;
      animation: slideUp 0.5s ease;
      width: 300px;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 30px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    #a2hs-popup button {
      margin-top: 10px;
      background: #333;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-wrapper">
      <img src="pfp2.jpg" alt="Profile Picture" class="profile-pic">
      <a href="https://zaptly.info/linkdemo" class="demo-label">DEMO</a>
    </div>

    <h1>Demo Business</h1>
    <p><b>Choose the department you’d like to view staff members from</b></p>

    <ul id="share-links">
      <li><a class="share-button" href="https://demo-link.com/finance"><span>Finance</span><i class="fas fa-arrow-right"></i></a></li>
      <li><a class="share-button" href="https://demo-link.com/management"><span>Management</span><i class="fas fa-arrow-right"></i></a></li>
      <li><a class="share-button" href="https://demo-link.com/software"><span>Software/IT</span><i class="fas fa-arrow-right"></i></a></li>
      <li><a class="share-button" href="https://demo-link.com/marketing"><span>Marketing</span><i class="fas fa-arrow-right"></i></a></li>
      <li><a class="share-button" href="https://demo-link.com/hr"><span>Human Resources</span><i class="fas fa-arrow-right"></i></a></li>
    </ul>

    <hr>

    <div class="actions">
      <a class="share-button" href="#" onclick="shareSite()"><i class="fas fa-share-alt"></i><span>Share</span></a>
      <br>
      <a class="share-button" href="#" onclick="showInstallPopup()"><i class="fas fa-plus-circle"></i><span>Add to Home Screen</span></a>
    </div>
  </div>

  <div id="a2hs-popup">
    <strong>Add to Home Screen</strong>
    <p style="font-size: 14px; margin-top: 8px;">
      Tap <b>Share</b> then <b>"Add to Home Screen"</b><br> from your browser menu.
    </p>
    <button onclick="hidePopup()">Close</button>
  </div>

  <script>
    function shareSite() {
      if (navigator.share) {
        navigator.share({
          title: 'Check out this demo business!',
          text: 'View our staff and contact team members instantly.',
          url: window.location.href
        }).catch(console.error);
      } else {
        alert("Sharing is not supported on this browser.");
      }
    }

    function showInstallPopup() {
      document.getElementById('a2hs-popup').style.display = 'block';
    }

    function hidePopup() {
      document.getElementById('a2hs-popup').style.display = 'none';
    }
  </script>
</body>
</html>
